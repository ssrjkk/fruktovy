<!doctype html>
<html lang="ru" data-theme="market">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; worker-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена — Фруктовый дворец</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1B4D3E">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="assets/fonts.css">
  <style>
    :root {
      --linen: #FAF5EC;
      --ink: #1D2622;
      --ink-muted: #55655C;
      --cedar: #8C5E3C;
      --accent: #1B4D3E;
      --accent-ink: #FAF5EC;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--linen);
      color: var(--ink);
      font-family: "Manrope", system-ui, "Segoe UI", sans-serif;
      padding: 24px;
    }
    .page-404 { max-width: 560px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .page-404 img { width: 84px; height: 84px; }
    .serif { font-family: "Cormorant Garamond", Georgia, serif; }
    h1 { font-size: clamp(28px, 6vw, 40px); margin: 0; }
    p { margin: 0; font-size: 16px; line-height: 1.55; color: var(--ink-muted); }
    .page-404-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 6px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 44px; padding: 0 18px; border-radius: 999px;
      font-weight: 700; font-size: 15px; text-decoration: none;
      border: 1px solid transparent;
    }
    .btn-primary { background: var(--accent); color: var(--accent-ink); }
    .btn-outline { background: transparent; color: var(--ink); border-color: var(--cedar); }
    .btn:focus-visible { outline: 3px solid #B8860B; outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="page-404">
    <img src="assets/logo.svg" alt="Фруктовый дворец" width="84" height="84">
    <h1 class="serif">404 — такой страницы нет</h1>
    <p>Зато на Сытнинской, 12 каждый день с 08:00 до 21:00 лежат свежие фрукты, овощи, орехи и специи.</p>
    <div class="page-404-actions">
      <a class="btn btn-primary" href="./">На прилавок</a>
      <a class="btn btn-outline" href="./#catalog">Каталог</a>
    </div>
  </main>
</body>
</html>
