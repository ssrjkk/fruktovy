name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: secret scan
        env:
          PATTERN: (xox[baprs]-[A-Za-z0-9-]{10,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{30,})
        run: |
          set -euo pipefail
          rc=0
          git grep -n -I -E "$PATTERN" -- . || rc=$?
          if [ "$rc" -eq 0 ]; then echo "::error::Potential secret committed"; exit 1; fi
          if [ "$rc" -ne 1 ]; then echo "::error::secret scan failed: git exit $rc"; exit "$rc"; fi
          echo "Secret scan clean"

      - name: line endings and encoding
        run: |
          set -euo pipefail
          for f in index.html 404.html robots.txt sitemap.xml manifest.webmanifest README.md AGENT_DEPLOY.md NEXT_AGENT_PROMPT.md make_zip.py scripts/gate.mjs; do
            if grep -qU $'\r' "$f"; then echo "::error::$f содержит CRLF"; exit 1; fi
            iconv -f utf-8 -t utf-8 "$f" > /dev/null || { echo "::error::$f не является валидным UTF-8"; exit 1; }
          done
          echo "UTF-8 и LF порядок"

      - name: syntax of the inline scripts
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const s = fs.readFileSync("index.html", "utf8");
            const blocks = [...s.matchAll(/<script(?![^>]*ld\+json)[^>]*>([\s\S]*?)<\/script>/g)].map((m) => m[1]);
            if (blocks.length !== 2) { console.error("ожидалось 2 блока скриптов, найдено " + blocks.length); process.exit(1); }
            blocks.forEach((b, i) => fs.writeFileSync(`/tmp/fd-${i}.js`, b));
            console.log("извлечено блоков: " + blocks.length + ", размеры: " + blocks.map((b) => b.length).join(", "));
          '
          node --check /tmp/fd-0.js
          node --check /tmp/fd-1.js
          node --check scripts/gate.mjs
          python -c "import ast,sys; ast.parse(open('make_zip.py',encoding='utf-8').read()); print('make_zip.py компилируется')"

      - name: quality gate
        run: node scripts/gate.mjs

      - name: archive builds from the same files
        run: |
          set -euo pipefail
          python make_zip.py -o /tmp/release.zip
          python - <<'PY'
          import zipfile
          z = zipfile.ZipFile('/tmp/release.zip')
          bad = z.testzip()
          names = z.namelist()
          print(f"архив: {len(names)} файлов, контрольная сумма {'ok' if bad is None else 'БИТАЯ ' + bad}")
          assert bad is None
          assert 'index.html' in names and 'AGENT_DEPLOY.md' in names and 'NEXT_AGENT_PROMPT.md' in names
          PY

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: "."

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
