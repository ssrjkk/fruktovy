name: CodeQL

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  schedule:
    - cron: '12 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      security-events: write

    # scripts/gate.mjs следит за разметкой, ссылками, токенами и синхронизациями —
    # это гейт витрины, а не анализатор кода. CodeQL добавляет то, чего статика не видит:
    # опасные источники в javascript (innerHTML, URL, storage) и в python-скриптах.
    # Инлайновые скрипты страницы анализатор не разбирает, для них в deploy.yml стоит
    # node --check и в живом браузере смотрятся нарушения CSP.
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'python', 'actions']

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
