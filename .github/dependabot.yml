version: 2
# @author ssrjkk | обновлено
#
# Следим только за actions: витрина — один index.html со своими стилями и скриптами,
# npm-зависимостей и pip-зависимостей в репозитории нет (шрифты, фото и иконки лежат
# файлами, архив собирается make_zip.py на чистой стандартной библиотеке Python).
# Поэтому у dependabot нет ни package.json, ни requirements.txt — обновлять ему нечего,
# кроме steps в .github/workflows.
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
      include: 'scope'
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
